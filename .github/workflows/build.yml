name: build

on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Compatibility checks and package build
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source for compatibility checks
        uses: actions/checkout@v7
        with:
          ref: 'main'

      - name: Set up Python 3.14 for compatibility checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check Python 3.14 compatibility (OpenATV 8.0)
        run: |
          pip3 install CT3
          python -m compileall -l . -r 10 -q
          cheetah compile -R plugin
          python testsuite/evil_eval.py

      - name: Set up Python 3.13 for compatibility checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check Python 3.13 compatibility (OpenATV 7.6)
        run: |
          pip3 install CT3
          python -m compileall -l . -r 10 -q
          cheetah compile -R plugin
          python testsuite/evil_eval.py

      - name: Set up Python 3.12 for compatibility checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Python 3.12 compatibility
        run: |
          pip3 install CT3
          python -m compileall -l . -r 10 -q
          cheetah compile -R plugin
          python testsuite/evil_eval.py

      - name: Set up Python 3.11 for compatibility checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check Python 3.11 compatibility
        run: |
          pip3 install CT3
          python -m compileall -l . -r 10 -q
          cheetah compile -R plugin
          python testsuite/evil_eval.py

      - name: Set up Python 3.10 for compatibility checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Check Python 3.10 compatibility
        run: |
          pip3 install CT3
          python -m compileall -l . -r 10 -q
          cheetah compile -R plugin
          python testsuite/evil_eval.py

      - name: Set up Python 3.9 for compatibility checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Check Python 3.9 compatibility
        run: |
          pip3 install CT3
          python -m compileall -l . -r 10 -q
          cheetah compile -R plugin
          python testsuite/evil_eval.py

      - name: Check out clean source and full history for packaging
        uses: actions/checkout@v7
        with:
          ref: 'main'
          fetch-depth: 0

      - name: Set up Python 3.14 for packaging
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install package and documentation build dependencies
        run: |
          sudo apt-get -q update
          sudo apt-get install -y closure-compiler nodejs npm dos2unix gettext python3-sphinx
          sudo npm install -g jshint
          pip3 install CT3
          pip3 install autopep8
          pip3 install pyOpenSSL
          pip3 install twisted
          pip3 install sphinx-rtd-theme
          pip3 install sphinxcontrib-napoleon
          pip3 install sphinxcontrib-websupport
          pip3 install sphinxcontrib-httpdomain

      - name: Prepare OpenWebif sources and build web assets
        run: |
          ./CI/build.sh

      - name: Create IPK package (Python 3.14)
        run: |
          ./CI/create_ipk.sh
          export PKG1=$(ls -1 .dist/*_all.ipk)
          mkdir Rel
          touch ./Rel/.nojekyll
          mv "${PKG1}" ./Rel
          cd Rel
          export PKG1=$(ls -1 *_all.ipk)
          ln -s "${PKG1}" enigma2-plugin-extensions-openwebif_topic2k-edition_latest_all.ipk
          cd ..

      - name: Build HTML documentation
        run: |
          cd doc
          make html
          cd build/html
          mv * ../../../Rel/
          cd ../../../

      - name: Upload IPK package and HTML documentation
        uses: actions/upload-artifact@v7
        with:
          name: openwebif-build
          path: ./Rel
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload versioned IPK package for direct download
        uses: actions/upload-artifact@v7
        with:
          path: ./Rel/enigma2-plugin-extensions-openwebif_topic2k-edition_[0-9]*_all.ipk
          archive: false
          if-no-files-found: error

      #- uses: peaceiris/actions-gh-pages@v4
      #  with:
      #    github_token: ${{ secrets.GITHUB_TOKEN }}
      #    publish_dir: ./Rel
      #    force_orphan: true
