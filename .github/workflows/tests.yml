name: tests

on:
  workflow_call:

permissions:
  contents: read

env:
  OPENWEBIF_ALLOW_HARDWARE_TESTS: 'NO'

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install CT3 requests

      - name: Run Python tests
        run: python -m unittest discover -s testsuite -p 'test_*.py' -v

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JavaScript tests
        run: node --test testsuite/test_*.js

  epg-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: testsuite/integration/package-lock.json

      - name: Install rendering and browser test dependencies
        run: |
          python -m pip install CT3
          npm ci --prefix testsuite/integration --ignore-scripts --no-audit --no-fund
          node testsuite/integration/node_modules/playwright/cli.js install --with-deps chromium

      - name: Run rendered modern EPG integration tests
        run: python -m unittest discover -s testsuite/integration -p 'test_*.py' -v
